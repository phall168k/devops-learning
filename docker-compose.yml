services:
  # PostgreSQL
  devop-db-prod:
    image: postgres:16-alpine
    container_name: devop-db-prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - devop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_network
    restart: unless-stopped

# Nest API
  devop-nest-prod:
    image: phall168k/devops-learning-backend:latest
    container_name: devop-nest-prod
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${API_PORT}/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      devop-db-prod:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped

# Nuxt APP
  devop-nuxt-prod:
    image: phall168k/devops-learning-frontend:latest
    container_name: devop-nuxt-prod
    env_file:
      - ./frontend/.env
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      devop-nest-prod:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped
    
  # Nginx
  devop-nginx-prod:
    image: nginx:1.27-alpine
    container_name: devop-nginx-prod
    ports:
      - "8080:80"
    environment:
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:-_}"
      NGINX_CLIENT_BODY_MAX_SIZE: "${NGINX_CLIENT_BODY_MAX_SIZE:-100M}"
      NGINX_ENVSUBST_FILTER: "^(NGINX_SERVER_NAME|NGINX_CLIENT_BODY_MAX_SIZE)$$"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      devop-nuxt-prod:
        condition: service_healthy
    networks:
      - internal_network
      - external_network
    restart: unless-stopped

volumes:
  devop_postgres_data:

networks:
  internal_network:
    driver: bridge
    internal: true
  external_network:
    driver: bridge
  
