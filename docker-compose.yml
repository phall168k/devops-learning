services:
  # PostgreSQL
  devop-db-prod:
    image: postgres:16-alpine
    container_name: devop-db-prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - devop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_network
    restart: unless-stopped

# Nest API
  devop-nest-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: devop-nest-prod
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${API_PORT}/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      devop-db-prod:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped

# Nuxt APP
  devop-nuxt-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: devop-nuxt-prod
    env_file:
      - ./frontend/.env
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      devop-nest-prod:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped

  # Nginx Proxy manager database
  nginx-proxy-db-prod:
    image: postgres:16-alpine
    container_name: nginx-proxy-db-prod
    environment:
      POSTGRES_USER: ${PROXY_DB_USERNAME}
      POSTGRES_PASSWORD: ${PROXY_DB_PASSWORD}
      POSTGRES_DB: ${PROXY_DB_DATABASE}
      TZ: ${DB_TZ}
      PGTZ: ${DB_PGTZ}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - npm_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_network
    restart: unless-stopped

  # Nginx Proxy manager
  nginx-proxy-manager-prod:
    image: 'jc21/nginx-proxy-manager:2.15.1'
    container_name: nginx-proxy-manager-prod
    environment:
      TZ: ${DB_TZ}
      DB_POSTGRES_HOST: ${PROXY_DB_HOST}
      DB_POSTGRES_PORT: ${PROXY_DB_PORT}
      DB_POSTGRES_USER: ${PROXY_DB_USERNAME}
      DB_POSTGRES_PASSWORD: ${PROXY_DB_PASSWORD}
      DB_POSTGRES_NAME: ${PROXY_DB_DATABASE}
    ports:
      - "8080:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_prod_data:/data
      - npm_prod_letsencrypt:/etc/letsencrypt
    depends_on:
      - devop-nuxt-prod
      - nginx-proxy-db-prod
    networks:
      - internal_network
      - external_network
    restart: unless-stopped
    
volumes:
  devop_postgres_data:
  npm_postgres_prod_data:
  npm_prod_data:
  
networks:
  internal_network:
    driver: bridge
    internal: true
  external_network:
    driver: bridge
  
